# GoReleaser configuration for hdf.
# Docs: https://goreleaser.com
# Validate with: goreleaser check
# Test locally without publishing:
#   go install github.com/goreleaser/goreleaser/v2@latest
#   goreleaser release --snapshot --clean
version: 2

project_name: hdf

before:
  hooks:
    # The GUIs embed frontend/dist and frontend-vuejs/dist (see each
    # directory's assets.go), so the frontends must be built before Go
    # compilation.
    - npm --prefix frontend ci
    - npm --prefix frontend run build
    - npm --prefix frontend-vuejs ci
    - npm --prefix frontend-vuejs run build

builds:
  - id: hdf
    main: .
    binary: hdf
    env:
      # The CLI builds fully static without cgo, which is what makes
      # cross-compiling all four targets from one Linux runner possible.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X hdf/internal/cli.version={{.Version}}

  # The GUI plugins. Wails needs cgo, which rules out cross-compiling, so
  # they're built only for the release runner's own platform (ubuntu-latest,
  # linux/amd64) and land in that archive next to hdf, where hdf finds them.
  # The tags are what `wails build` passes to `go build`; webkit2_41 selects
  # the WebKitGTK 4.1 API that Ubuntu 24.04 ships.
  - id: hdf-gui-vanilla
    main: ./cmd/hdf-gui-vanilla
    binary: hdf-gui-vanilla
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=desktop,production,webkit2_41
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: hdf-gui-vuejs
    main: ./cmd/hdf-gui-vuejs
    binary: hdf-gui-vuejs
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=desktop,production,webkit2_41
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test"
      - "^ci:"
      - "^chore"

release:
  # Tags containing a hyphenated suffix (v1.0.0-rc.1, v1.0.0-beta.2, …) are
  # automatically published as GitHub pre-releases; plain tags (v1.0.0) become
  # full releases. See docs/creating-releases.md.
  prerelease: auto
