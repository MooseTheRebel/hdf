name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: for d in cmd/hdf-gui-*/frontend; do mkdir -p "$d/dist" && touch "$d/dist/.gitkeep"; done
      - run: go test ./...
      - run: go test -tags e2e ./...
