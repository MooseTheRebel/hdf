name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: mkdir -p frontend/dist frontend-vuejs/dist && touch frontend/dist/.gitkeep frontend-vuejs/dist/.gitkeep
      - run: go test ./...
      - run: go test -tags e2e ./...
