version: 2
updates:
  # Manage pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    # One entry for both frontends, so a group's PR spans both directories.
    directories:
      - /cmd/hdf-gui-vanilla/frontend
      - /cmd/hdf-gui-vuejs/frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # vue-tsc needs TypeScript's JavaScript API, which TypeScript 7 (the
      # native Go port) doesn't ship.
      - dependency-name: typescript
        versions: [">=7"]
