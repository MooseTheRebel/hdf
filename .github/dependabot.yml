version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /cmd/hdf-gui-vanilla/frontend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /cmd/hdf-gui-vuejs/frontend
    schedule:
      interval: weekly
    ignore:
      # vue-tsc needs TypeScript's JavaScript API, which TypeScript 7 (the
      # native Go port) doesn't ship.
      - dependency-name: typescript
        versions: [">=7"]
